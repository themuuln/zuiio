packages:
  - "packages/*"
  - "apps/*"
  - "apps/*/packages/*"

catalog:
  # Next.js — active apps use 16.3.0-preview.5
  next: 16.3.0-preview.5
  # React — latest stable
  react: ^19.2.7
  "@types/react": ^19.2.17
  # TypeScript — 5.x stable
  typescript: ^5.9.3
  # Biome — latest
  "@biomejs/biome": 2.4.16
  # Vitest — latest
  vitest: ^4.1.10
  # TanStack Query
  "@tanstack/react-query": ^5.101.2
  # Supabase
  "@supabase/supabase-js": ^2.110.1

allowBuilds:
  '@google/genai': true
  "@parcel/watcher": true
  '@percy/core': true
  "@sentry/cli": true
  '@shopify/react-native-skia': true
  "@swc/core": true
  argon2: true
  core-js: true
  esbuild: true
  koffi: true
  msgpackr-extract: true
  msw: true
  node-pty: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.6'
  - '@expo/config-plugins@57.0.3'
  - '@expo/config@57.0.3'
  - '@expo/fingerprint@0.20.3'
  - '@expo/inline-modules@0.1.2'
  - '@expo/prebuild-config@57.0.5'
  - '@expo/router-server@57.0.2'
  - babel-preset-expo@57.0.2
  - expo-modules-autolinking@57.0.5
  - expo-modules-core@57.0.3
  - expo-modules-jsi@0.1.2
  - expo@57.0.4
  - '@expo/ui@57.0.4'
  - expo-router@57.0.4
  - '@zuiio/*'
