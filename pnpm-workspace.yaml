packages:
  - "packages/*"
  - "apps/*"
  - "apps/*/packages/*"

catalog:
  # Next.js
  next: ^16.2.10
  # React
  react: ^19.2.7
  react-dom: ^19.2.7
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.0
  # Biome
  "@biomejs/biome": 2.5.4
  # Vitest
  vitest: ^4.1.10
  # TanStack Query
  "@tanstack/react-query": ^5.101.2
  # Supabase
  "@supabase/supabase-js": ^2.110.7
  "@supabase/ssr": ^0.12.3
  # TypeScript
  typescript: npm:@typescript/typescript6@^6.0.2
  "@types/node": ^26.1.1
  # Tailwind CSS
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  postcss: ^8.5.0
  # Zod
  zod: ^4.4.3
  # Sharp
  sharp: ^0.35.3
  # UI
  "react-hook-form": ^7.81.0
  "@hookform/resolvers": ^5.4.0
  sonner: ^2.0.7
  clsx: ^2.1.1
  "tailwind-merge": ^3.6.0
  "class-variance-authority": ^0.7.1
  "next-themes": ^0.4.6
  cmdk: ^1.1.1
  "date-fns": ^4.4.0
  "lucide-react": ^1.25.0
  recharts: ^3.9.2
  "@phosphor-icons/react": ^2.1.10
  # Testing
  "@playwright/test": ^1.61.1
  "@testing-library/react": ^16.3.2
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/user-event": ^14.6.1
  jsdom: ^29.1.1
  # Server
  server-only: ^0.0.1

allowBuilds:
  '@google/genai': true
  "@parcel/watcher": true
  '@percy/core': true
  "@sentry/cli": true
  '@shopify/react-native-skia': true
  "@swc/core": true
  argon2: true
  core-js: true
  esbuild: true
  koffi: true
  msgpackr-extract: true
  msw: true
  node-pty: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.6'
  - '@expo/config-plugins@57.0.3'
  - '@expo/config@57.0.3'
  - '@expo/fingerprint@0.20.3'
  - '@expo/inline-modules@0.1.2'
  - '@expo/prebuild-config@57.0.5'
  - '@expo/router-server@57.0.2'
  - babel-preset-expo@57.0.2
  - expo-modules-autolinking@57.0.5
  - expo-modules-core@57.0.3
  - expo-modules-jsi@0.1.2
  - expo@57.0.4
  - '@expo/ui@57.0.4'
  - expo-router@57.0.4
  - '@zuiio/*'
  - '@supabase/auth-js@2.110.7'
  - '@supabase/functions-js@2.110.7'
  - '@supabase/postgrest-js@2.110.7'
  - '@supabase/realtime-js@2.110.7'
