packages:
  - "packages/*"
  - "apps/*"
  - "apps/*/packages/*"
allowBuilds:
  '@google/genai': true
  "@parcel/watcher": true
  '@percy/core': true
  "@sentry/cli": true
  "@swc/core": true
  core-js: true
  esbuild: true
  koffi: true
  msgpackr-extract: true
  msw: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.6'
  - '@expo/config-plugins@57.0.3'
  - '@expo/config@57.0.3'
  - '@expo/fingerprint@0.20.3'
  - '@expo/inline-modules@0.1.2'
  - '@expo/prebuild-config@57.0.5'
  - '@expo/router-server@57.0.2'
  - babel-preset-expo@57.0.2
  - expo-modules-autolinking@57.0.5
  - expo-modules-core@57.0.3
  - expo-modules-jsi@57.0.1
  - expo@57.0.4
  - '@expo/ui@57.0.4'
  - expo-router@57.0.4
