packages:
  - "packages/*"
  - "apps/*"
  - "apps/*/packages/*"

catalog:
  # Next.js — active apps use 16.3.0-preview.6
  next: 16.3.0-preview.6
  # React — latest stable
  react: ^19.2.7
  react-dom: ^19.2.7
  "@types/react": ^19.2.17
  # Biome — latest
  "@biomejs/biome": 2.4.16
  # Vitest — latest
  vitest: ^4.1.10
  # TanStack Query
  "@tanstack/react-query": ^5.101.2
  # Supabase
  "@supabase/supabase-js": ^2.110.3
  # TypeScript
  typescript: npm:@typescript/typescript6@^6.0.2
  "@types/node": ^24.0.0
  "@types/react-dom": ^19.2.0
  # Tailwind CSS
  tailwindcss: ^4.1.0
  "@tailwindcss/postcss": ^4.1.0
  postcss: ^8.5.0

allowBuilds:
  '@google/genai': true
  "@parcel/watcher": true
  '@percy/core': true
  "@sentry/cli": true
  '@shopify/react-native-skia': true
  "@swc/core": true
  argon2: true
  core-js: true
  esbuild: true
  koffi: true
  msgpackr-extract: true
  msw: true
  node-pty: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.6 || 57.0.9'
  - '@expo/config-plugins@57.0.3'
  - '@expo/config@57.0.3'
  - '@expo/fingerprint@0.20.3'
  - '@expo/inline-modules@0.1.2'
  - '@expo/prebuild-config@57.0.5 || 57.0.8'
  - '@expo/router-server@57.0.2'
  - babel-preset-expo@57.0.2
  - expo-modules-autolinking@57.0.5 || 57.0.8
  - expo-modules-core@57.0.3 || 57.0.6
  - expo-modules-jsi@0.1.2
  - expo@57.0.4 || 57.0.7
  - '@expo/ui@57.0.4 || 57.0.7'
  - expo-router@57.0.4 || 57.0.7
  - '@zuiio/*'
  - '@expo/metro-config@57.0.6'
  - expo-asset@57.0.6
  - expo-constants@57.0.6
  - expo-application@57.0.2
  - expo-auth-session@57.0.4
  - expo-image-picker@57.0.5
  - expo-location@57.0.5
  - expo-notifications@57.0.6
  - expo-sharing@57.0.6
  - expo-updates@57.0.8
