appId: com.tamga
name: Lost livestock recovery

tags:
  - recovery
  - offline
  - smoke

---
- launchApp:
    clearState: true

# Finish onboarding without creating a horse so the recovery flow stays manual.
- assertVisible: "Эхлэх"
- tapOn: "Эхлэх"
- tapOn:
    text: ".*Уяач / Малчин.*"
- tapOn: "Үргэлжлүүлэх"
- tapOn:
    text: ".*Төв.*"
- tapOn: "Үргэлжлүүлэх"
- tapOn:
    text: ".*Алгасах.*"
- tapOn:
    text: ".*Алгасах.*"
- tapOn: "Одоохондоо үгүй"
- tapOn: "Дараа тохируулъя"

# Completion navigates directly to the daily command center.
- assertVisible: ".*Сайн байна уу.*"

# Open the free lost-livestock report wizard from the home command center.
- tapOn: "Алдсан морь мэдээлэх"
- assertVisible: ".*Амьтнаа таних мэдээлэл.*"
# Open the animal-source dropdown and select "Manual entry" (closes the menu;
# form fields are not targetable while the menu is open).
- tapOn: "Гараар оруулах / Manual entry"
- tapOn: "Гараар оруулах / Manual entry"
- tapOn: "Нэр / Name (optional)"
- inputText: "Bor mori"
- scrollUntilVisible:
    element: "Таних дэлгэрэнгүй / Detailed identifier"
    direction: DOWN
- tapOn: "Таних дэлгэрэнгүй / Detailed identifier"
- inputText: "Distinctive brown horse with a white mark"
# The Continue button stays visible above the keyboard (scaffold insets),
# and hideKeyboard is unreliable on this Flutter/iOS setup — tap directly.
- tapOn: "Үргэлжлүүлэх / Continue"

# Select a regional pin and enter coordinates manually when GPS is unavailable.
- assertVisible: ".*Сүүлд үзэгдсэн газар.*"
# The ListView keeps its step-1 scroll offset, which hides the aimag field
# above the viewport. Force-scroll back to the top, then tap the aimag
# dropdown by position — it has no accessibility text until a value is
# selected, so it is invisible to element matching (measured at ~28% height).
- swipe:
    direction: DOWN
    duration: 500
- swipe:
    direction: DOWN
    duration: 500
- assertVisible: ".*Сүүлд үзэгдсэн газар.*"
- tapOn:
    point: "50%,28%"
- tapOn: "Төв"
- tapOn: "Сум / Sum"
- inputText: "Зуунмод"
- tapOn: "Баг / Bag (optional)"
- inputText: "1-r bag"
- tapOn: "Газрын нэр / Place name (optional)"
- inputText: "Zuunmod zah"
- scrollUntilVisible:
    element: "Latitude"
    direction: DOWN
- tapOn: "Latitude"
- inputText: "47.918"
- tapOn: "Longitude"
- inputText: "106.917"
- tapOn: "Үргэлжлүүлэх / Continue"

# The report is written locally first and remains private until sync.
- assertVisible: "Шалгаж баталгаажуулах"
- tapOn: "Зар хадгалах / Save report"
- assertVisible:
    text: ".*Синк хүлээгдэж байна.*"
