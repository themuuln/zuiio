appId: com.tamga
name: Lost livestock recovery

tags:
  - recovery
  - offline
  - smoke

---
- launchApp:
    clearState: true

# Finish onboarding without creating a horse so the recovery flow stays manual.
- assertVisible: "Эхлэх"
- tapOn: "Эхлэх"
- tapOn:
    text: ".*Уяач / Малчин.*"
- tapOn: "Үргэлжлүүлэх"
- tapOn:
    text: ".*Төв.*"
- tapOn: "Үргэлжлүүлэх"
- tapOn:
    text: ".*Алгасах.*"
- tapOn:
    text: ".*Алгасах.*"
- tapOn: "Одоохондоо үгүй"
- tapOn: "Дараа тохируулъя"

# Completion navigates directly to the daily command center. The header
# greets anonymous (skip-profile) users with "Өнөөдөр" since no name is set.
- assertVisible: ".*Өнөөдөр.*"

# Open the free lost-livestock report wizard from the home command center.
- tapOn: "Алдсан морь мэдээлэх"
- assertVisible: ".*Амьтнаа таних мэдээлэл.*"
# Open the animal-source dropdown and select "Manual entry" (closes the menu;
# form fields are not targetable while the menu is open).
- tapOn: "Гараар оруулах / Manual entry"
- tapOn: "Гараар оруулах / Manual entry"
- tapOn: "Нэр / Name (optional)"
- inputText: "Bor mori"
- scrollUntilVisible:
    element: "Таних дэлгэрэнгүй / Detailed identifier"
    direction: DOWN
- tapOn: "Таних дэлгэрэнгүй / Detailed identifier"
- inputText: "Distinctive brown horse with a white mark"
# The Continue button stays visible above the keyboard (scaffold insets),
# and hideKeyboard is unreliable on this Flutter/iOS setup — tap directly.
- tapOn: "Үргэлжлүүлэх / Continue"

# Select a regional pin and enter coordinates manually when GPS is unavailable.
- assertVisible: ".*Сүүлд үзэгдсэн газар.*"
# The aimag dropdown has no accessibility text until a value is selected, so
# open it by position (measured: field center at ~50%,32%) and pick "Төв"
# from the scrollable menu.
- tapOn:
    point: "50%,32%"
- extendedWaitUntil:
    visible: ".*Дархан-Уул.*"
    timeout: 8000
- scrollUntilVisible:
    element: "Төв"
    direction: DOWN
- tapOn: "Төв"
- tapOn: "Сум / Sum"
- inputText: "Зуунмод"
# Dismiss the keyboard so the next fields are tappable above it.
- tapOn:
    id: "Done"
- tapOn: "Баг / Bag (optional)"
- inputText: "1-r bag"
- tapOn:
    id: "Done"
- tapOn: "Газрын нэр / Place name (optional)"
- inputText: "Zuunmod zah"
- tapOn:
    id: "Done"
- scrollUntilVisible:
    element: ".*Latitude.*"
    direction: DOWN
- tapOn: "Latitude"
- inputText: "47.918"
- tapOn: "Longitude"
- inputText: "106.917"
- tapOn: "Үргэлжлүүлэх / Continue"

# Review screen. The title is a combined accessibility node, so regex-match it.
- assertVisible:
    text: ".*Шалгаж баталгаажуулах.*"
- tapOn: "Зар хадгалах / Save report"
# Anonymous (guest) users are prompted to sign in before the report is saved;
# the wizard itself completed offline. (Reports require an identity so the
# finder can contact the reporter.)
- assertVisible:
    text: ".*Нэвтэрсний дараа зар хадгална уу.*"
