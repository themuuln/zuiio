# Shared subflow — connect to Expo Dev Client launcher
# Run this after launchApp to connect to Metro dev server

appId: mn.tamga.app
name: Connect to Dev Server

---
# Handle Expo Dev Client launcher
- extendedWaitUntil:
    visible: "http"
    timeout: 15000
- tapOn:
    text: "http"
    index: 0
- extendedWaitUntil:
    visible: "Миний морь"
    timeout: 30000
