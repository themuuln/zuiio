# App Launch — verify initial state

appId: mn.tamga.app
name: App Launch

onFlowStart:
  - clearState

---
- launchApp

- runFlow:
    when:
      visible: "Open"
    file: ../subflows/dismiss-open-dialog.yaml

- extendedWaitUntil:
    visible: "Миний морь"
    timeout: 30000

- assertVisible: "Миний морь"
- assertVisible: "Тамга — Морины менежмент"

- takeScreenshot: app_launch
