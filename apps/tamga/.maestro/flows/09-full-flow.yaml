# Full Flow — complete user journey

appId: mn.tamga.app
name: Full Journey

onFlowStart:
  - clearState

---
- launchApp

- runFlow:
    when:
      visible: "Open"
    file: ../subflows/dismiss-open-dialog.yaml

# Navigate to horses tab
- tapOn: "Морь, tab, 1 of 8"
- extendedWaitUntil:
    visible: "Миний морь"
    timeout: 30000

# Navigate through all tabs
- tapOn: "Удам, tab, 2 of 8"
- extendedWaitUntil:
    visible: "Удам судлал"
    timeout: 10000

- tapOn: "Зах, tab, 3 of 8"
- extendedWaitUntil:
    visible: "Морины зах"
    timeout: 10000

- tapOn: "Эвент, tab, 4 of 8"
- extendedWaitUntil:
    visible: "Эвентүүд"
    timeout: 10000

# Profile
- tapOn: "Профайл, tab, 8 of 8"
- extendedWaitUntil:
    visible: "Батбаяр"
    timeout: 10000

# Back home
- tapOn: "Морь, tab, 1 of 8"
- extendedWaitUntil:
    visible: "Миний морь"
    timeout: 10000

- takeScreenshot: full_flow_complete
