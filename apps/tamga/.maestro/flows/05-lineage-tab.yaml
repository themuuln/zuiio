# Lineage Tab

appId: mn.tamga.app
name: Lineage Tab

onFlowStart:
  - clearState

---
- launchApp

- runFlow:
    when:
      visible: "Open"
    file: ../subflows/dismiss-open-dialog.yaml

- extendedWaitUntil:
    visible: "Миний морь"
    timeout: 30000

# Tap Удам tab (text selector)
- tapOn: "Удам, tab, 2 of 8"
- assertVisible: "Удам судлал"

- takeScreenshot: lineage_tab
