# Horses Tab — verify horse list loads

appId: mn.tamga.app
name: Horses Tab

onFlowStart:
  - clearState

---
- launchApp

- runFlow:
    when:
      visible: "Open"
    file: ../subflows/dismiss-open-dialog.yaml

# Navigate to horses tab
- tapOn: "Морь, tab, 1 of 8"
- extendedWaitUntil:
    visible: "Миний морь"
    timeout: 30000

# Verify horses list is showing
- assertVisible: "Тамга — Морины менежмент"

# Tap first horse card
- tapOn:
    point: "200,60"
- extendedWaitUntil:
    visible: "Морийн мэдээлэл"
    timeout: 10000

- takeScreenshot: horses_tab
