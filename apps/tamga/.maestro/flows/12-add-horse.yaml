# Add Horse — verify add horse flow

appId: mn.tamga.app
name: Add Horse

onFlowStart:
  - clearState

---
- launchApp

- runFlow:
    when:
      visible: "Open"
    file: ../subflows/dismiss-open-dialog.yaml

# Navigate to horses tab
- tapOn: "Морь, tab, 1 of 8"
- extendedWaitUntil:
    visible: "Миний морь"
    timeout: 30000

# Tap add horse button (FAB)
- tapOn:
    id: "add_horse_fab"
- extendedWaitUntil:
    visible: "Морь нэмэх"
    timeout: 10000

- assertVisible: "Морь нэмэх"

- takeScreenshot: add_horse_screen
