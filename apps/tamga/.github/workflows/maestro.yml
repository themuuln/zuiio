# Tamga Maestro UI Tests — black-box regression gate
#
# Runs the Maestro flows (test/maestro/) against a debug build on an iOS
# simulator. Triggered manually (workflow_dispatch) or on PRs that touch
# app code / flows.
#
# Note: the android/ directory is Expo/React Native (Flutter→Expo migration
# in progress), so the Flutter app only builds for iOS here.

name: maestro

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/maestro/**"
      - ".github/workflows/maestro.yml"

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  maestro:
    name: Maestro UI Tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Maestro requires a Java runtime.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
            pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9]+ \([0-9A-F-]+\)' | head -1 | grep -Eo '[0-9A-F-]{36}')
          if [ -z "$DEVICE" ]; then
            echo "::error::No available iPhone simulator found"
            exit 1
          fi
          echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build debug app for simulator
        run: flutter build ios --simulator --debug

      - name: Boot simulator and install app
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          xcrun simctl install "${{ steps.sim.outputs.udid }}" \
            build/ios/iphonesimulator/Runner.app

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro smoke test
        run: maestro test test/maestro/smoke.yaml --device "${{ steps.sim.outputs.udid }}"

      - name: Run Maestro onboarding test
        run: maestro test test/maestro/onboarding.yaml --device "${{ steps.sim.outputs.udid }}"

      - name: Shut down simulator
        if: always()
        run: xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
