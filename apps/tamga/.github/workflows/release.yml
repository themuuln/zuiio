# Tamga Release — triggered by version tags
#
# Produces universal APK, split-per-abi APKs, and AAB,
# then creates a GitHub Release with all artifacts attached.
# Suitable for sideload distribution.

name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
            pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Cache key for downstream jobs
        id: cache-key
        run: echo "key=pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: dart analyze --fatal-infos

      - name: Run tests
        run: flutter test

  build:
    name: Build Release Artifacts
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ needs.quality.outputs.cache-key }}
          restore-keys: |
            pub-${{ runner.os }}-
            pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build split-per-abi APKs
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          if git describe --abbrev=0 --tags HEAD^ &>/dev/null; then
            PREV_TAG=$(git describe --abbrev=0 --tags HEAD^)
            git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD > release_notes.txt
          else
            git log --pretty=format:"- %s (%h)" -20 > release_notes.txt
          fi
          echo "Release notes generated ($(wc -l < release_notes.txt) lines)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tamga ${{ steps.version.outputs.tag }}
          body_path: release_notes.txt
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/arm64-v8a/*
            build/app/outputs/flutter-apk/armeabi-v7a/*
            build/app/outputs/flutter-apk/x86_64/*
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
