# ── Decap CMS Configuration ──────────────────────────────────────────────
# Generated by Documentizer. Edit the values below to match your setup.
#
# Steps:
#   1. Create a GitLab OAuth application (non-confidential, PKCE):
#      Settings -> Applications -> Add application
#      - Redirect URI: https://your-docs-domain.com/admin/
#      - Scopes: api
#      - Uncheck "Confidential"
#   2. Copy the Application ID into `app_id` below
#   3. Set `repo` to your GitLab project path (e.g. group/project)
#   4. Update `api_root` / `base_url` for your self-hosted GitLab (if not gitlab.com)

backend:
  name: gitlab
  repo: GITLAB_GROUP/GITLAB_PROJECT
  auth_type: pkce
  app_id: YOUR_GITLAB_OAUTH_APP_ID
  api_root: https://gitlab.com/api/v4
  base_url: https://gitlab.com
  auth_endpoint: oauth/authorize

# ── How to configure for self-hosted GitLab ─────────────────────────────
# backend:
#   name: gitlab
#   repo: group/project
#   auth_type: pkce
#   app_id: YOUR_GITLAB_OAUTH_APP_ID
#   api_root: https://gitlab.yourdomain.com/api/v4
#   base_url: https://gitlab.yourdomain.com
#   auth_endpoint: oauth/authorize

# Where uploaded media files are stored
media_folder: docs/public/uploads
public_folder: /uploads

locale: en

# ── Collections ─────────────────────────────────────────────────────────
# Each collection maps to a section of the VitePress docs site.
# BAs can create, edit, and delete pages within each section.

collections:
  - name: "general"
    label: "General Pages"
    label_singular: "Page"
    folder: "docs"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    filter:
      field: "title"
      value: "*"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "desc", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "features"
