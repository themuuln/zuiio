# Supabase project configuration
# Generated for local development — https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54326
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54328

# Pooler disabled: default port 54329 is used by other apps' stacks in this
# monorepo. Integration tests connect straight to Postgres on [db] port.
[db.pooler]
enabled = false

[auth]
enabled = true

# Email auth settings
[auth.email]
enable_confirmations = true

[local_smtp]
enabled = true
port = 54331
smtp_port = 54332
pop3_port = 54333

# Storage
[storage]
enabled = true
file_size_limit = 52428800

# Multi-tenant brand assets bucket
[storage.buckets]
brand_assets = { public = true, file_size_limit = 2097152, allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/svg+xml"] }
