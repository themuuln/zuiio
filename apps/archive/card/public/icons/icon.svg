<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C28D9"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#F3F4F6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Inner card shape -->
  <rect x="106" y="106" width="300" height="360" rx="24" fill="url(#card)" stroke="#E5E7EB" stroke-width="4"/>
  <!-- Card border decoration -->
  <rect x="122" y="122" width="268" height="328" rx="16" fill="none" stroke="#D1D5DB" stroke-width="2"/>
  <!-- Top-left diamond -->
  <polygon points="156,180 176,200 156,220 136,200" fill="#6C28D9" opacity="0.6"/>
  <!-- Bottom-right diamond -->
  <polygon points="356,352 376,372 356,392 336,372" fill="#6C28D9" opacity="0.6"/>
  <!-- Center "F" letter -->
  <text x="256" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="220" font-weight="800" text-anchor="middle" fill="#6C28D9">F</text>
  <!-- Small "Friday" text -->
  <text x="256" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="500" text-anchor="middle" fill="#9CA3AF" letter-spacing="4">FRIDAY</text>
</svg>
