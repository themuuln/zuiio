
# Ports moved off the CLI defaults (54321-54330): an SSH tunnel used by
# another session occupies that range. Tolom's stack now lives at 54361+.
[api]
port = 54361
max_rows = 1000

[db]
port = 54362

[studio]
port = 54363

[local_smtp]
port = 54364

[analytics]
port = 54365

[db.pooler]
enabled = true
port = 54366
pool_mode = "transaction"
default_pool_size = 15
max_client_conn = 100

[functions.expire-subscriptions]
enabled = true
verify_jwt = false
import_map = "./functions/expire-subscriptions/deno.json"
entrypoint = "./functions/expire-subscriptions/index.ts"

[functions.check-service-reminders]
enabled = true
verify_jwt = false
import_map = "./functions/check-service-reminders/deno.json"
entrypoint = "./functions/check-service-reminders/index.ts"

[functions.telegram-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/telegram-webhook/deno.json"
entrypoint = "./functions/telegram-webhook/index.ts"

[functions.telegram-notify-owners]
enabled = true
verify_jwt = false
import_map = "./functions/telegram-notify-owners/deno.json"
entrypoint = "./functions/telegram-notify-owners/index.ts"
