# Validate docs build on PRs
name: Docs Check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'website/docs/**'
      - '.documentizer/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f "website/package.json" ]; then
            cd website && npm ci
          else
            npm ci
          fi

      - name: Build docs
        run: |
          if [ -f "website/package.json" ]; then
            cd website && npm run docs:build
          else
            npm run docs:build
          fi
