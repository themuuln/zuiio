<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOLOM — Offline</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0a0a0a;
        color: #fafafa;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }
      .container {
        text-align: center;
        max-width: 400px;
        padding: 2rem;
      }
      .logo {
        width: 64px;
        height: 64px;
        background: #000;
        border-radius: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
        font-size: 2rem;
        font-weight: 700;
        color: #fff;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #fafafa;
      }
      p {
        color: #a1a1aa;
        line-height: 1.5;
        margin-bottom: 0.25rem;
      }
      .sub {
        font-size: 0.875rem;
        margin-bottom: 2rem;
      }
      button {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover {
        background: #2563eb;
      }
      button:active {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">T</div>
      <h1>Интернэтгүй байна</h1>
      <p>You are offline.</p>
      <p class="sub">Check your internet connection and try again.</p>
      <button onclick="location.reload()">Дахин оролдох / Retry</button>
    </div>
  </body>
</html>
