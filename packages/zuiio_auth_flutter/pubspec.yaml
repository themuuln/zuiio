name: zuiio_auth_flutter
description: Shared Supabase Auth adapter for Zuiio Flutter products. Provides signInWithZuiio() for custom OIDC federation to Zuiio ID.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
