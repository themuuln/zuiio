[mcp_servers.next-devtools]
args = [ "-y", "next-devtools-mcp@latest" ]
command = "npx"

[mcp_servers.next-devtools.tools.init]
approval_mode = "approve"

[mcp_servers.next-devtools.tools.nextjs_index]
approval_mode = "approve"

[mcp_servers.next-devtools.tools.nextjs_call]
approval_mode = "approve"

[mcp_servers.next-devtools.tools.browser_eval]
approval_mode = "approve"

[mcp_servers.shadcn]
args = [ "shadcn@latest", "mcp" ]
command = "npx"

[mcp_servers.supabase-tolom]
url = "https://mcp.supabase.com/mcp?project_ref=fhzuolncswccxkcqzclg&features=docs%2Caccount%2Cdatabase%2Cdevelopment%2Cdebugging%2Cfunctions%2Cbranching%2Cstorage"

[mcp_servers.expect]
command = "npx"
args = [ "-y", "expect-cli@latest", "mcp" ]
startup_timeout_sec = 20
