name: Agents Lint

on:
  push:
    paths:
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
  pull_request:
    paths:
      - '**/AGENTS.md'
      - '**/CLAUDE.md'

jobs:
  lint:
    runs-on: [self-hosted, macOS, arm64, builder]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      # The builder has Node and pnpm installed; installer actions unpack into a
      # shared ~/setup-pnpm that races when several runner jobs start together.
      - name: Use the builder toolchain
        run: |
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          /opt/homebrew/bin/pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Run agents-lint on root
        run: npx agents-lint 2>&1 | tee /tmp/root-lint.txt
        continue-on-error: true

      - name: Run agents-lint on apps
        run: |
          for app in apps/*/; do
            if [ -f "$app/AGENTS.md" ]; then
              echo "=== Checking $app ==="
              cd "$app"
              npx agents-lint 2>&1 | tee -a /tmp/apps-lint.txt
              cd ../..
            fi
          done
        continue-on-error: true

      - name: Run agents-lint on packages
        run: |
          for pkg in packages/*/; do
            if [ -f "$pkg/AGENTS.md" ]; then
              echo "=== Checking $pkg ==="
              cd "$pkg"
              npx agents-lint 2>&1 | tee -a /tmp/packages-lint.txt
              cd ../..
            fi
          done
        continue-on-error: true

      - name: Check for critical errors
        run: |
          if grep -q "Context rot detected" /tmp/root-lint.txt /tmp/apps-lint.txt /tmp/packages-lint.txt 2>/dev/null; then
            echo "::warning::Context rot detected in AGENTS.md files. Run 'npx agents-lint' locally to fix."
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Agents Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Root" >> $GITHUB_STEP_SUMMARY
          cat /tmp/root-lint.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Apps" >> $GITHUB_STEP_SUMMARY
          cat /tmp/apps-lint.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages" >> $GITHUB_STEP_SUMMARY
          cat /tmp/packages-lint.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No results" >> $GITHUB_STEP_SUMMARY
