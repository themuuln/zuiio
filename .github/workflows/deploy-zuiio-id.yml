name: Deploy Zuiio ID

on:
  push:
    branches: [main]
    paths:
      - 'apps/zuiio-id/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-zuiio-id.yml'

concurrency:
  group: deploy-zuiio-id
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_ZUIIO_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ZUIIO_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_ZUIIO_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Vercel-compatible git author
        run: |
          git config user.email "themuuln6@gmail.com"
          git config user.name "Temuulen Undrakhbayar"
          git commit --amend --no-edit --reset-author

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Enable corepack
        run: corepack enable

      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage Vercel project config
        run: |
          mkdir -p .vercel
          echo '{"projectId":"'$VERCEL_PROJECT_ID'","orgId":"'$VERCEL_ORG_ID'"}' > .vercel/project.json
          echo '{"$schema":"https://openapi.vercel.sh/vercel.json","framework":"nextjs","installCommand":"pnpm install --frozen-lockfile","buildCommand":"pnpm exec turbo run build --filter=zuiio-id"}' > vercel.json

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --archive=tgz --token=$VERCEL_TOKEN
