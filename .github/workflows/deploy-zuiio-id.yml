name: Deploy Zuiio ID

on:
  push:
    branches: [main]
    paths:
      - "apps/zuiio-id/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-zuiio-id.yml"
      - ".github/workflows/_deploy-vercel.yml"

concurrency:
  group: deploy-zuiio-id
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: zuiio-id
      turbo-filter: "@zuiio/id"
      author-email: "themuuln6@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_ZUIIO_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_ZUIIO_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ZUIIO_ID }}
