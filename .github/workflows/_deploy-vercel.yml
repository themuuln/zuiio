name: _Deploy to Vercel (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: "App directory name (e.g. zer, tolom)"
        required: true
        type: string
      turbo-filter:
        description: "Turbo filter name (e.g. zer, @zuiio/id)"
        required: true
        type: string
      author-email:
        description: "Vercel Hobby account owner email (must match exactly)"
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Turborepo remote cache (uses Vercel token)
      TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TURBO_TEAM: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      # Sparse checkout: only fetch the app + shared packages (skip unused apps)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: |
            apps/${{ inputs.app }}
            packages
            config
            pnpm-lock.yaml
            pnpm-workspace.yaml
            package.json
            turbo.json
            tsconfig.json
            .github/workflows

      # Hobby plan blocks deploys where commit author != account owner.
      # Amend HEAD author to match the target Vercel account.
      - name: Set Vercel-compatible git author
        run: |
          git config user.email "${{ inputs.author-email }}"
          git config user.name "Temuulen Undrakhbayar"
          git commit --amend --no-edit --reset-author

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Enable corepack
        run: corepack enable

      # Skip pnpm store cache — 7GB cache takes 68s to restore but install is only 21s
      # Network install is faster than cache restore on Hobby plan
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache Vercel CLI to avoid reinstalling every run (~15s savings)
      - name: Cache Vercel CLI
        id: vercel-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/vercel
          key: ${{ runner.os }}-vercel-cli-${{ hashFiles('.github/workflows/_deploy-vercel.yml') }}

      - name: Install Vercel CLI
        if: steps.vercel-cache.outputs.cache-hit != 'true'
        run: npm i -g vercel@latest

      # Stage project.json + vercel.json so the Vercel CLI knows
      # which project to target and which turbo filter to build.
      - name: Stage Vercel project config
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          printf '{"$schema":"https://openapi.vercel.sh/vercel.json","framework":"nextjs","installCommand":"pnpm install --frozen-lockfile","buildCommand":"pnpm exec turbo run build --filter=%s"}\n' "${{ inputs.turbo-filter }}" > vercel.json

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --archive=tgz --token=$VERCEL_TOKEN
