name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".gitignore"

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      zer: ${{ steps.filter.outputs.zer }}
      tolom: ${{ steps.filter.outputs.tolom }}
      onoo: ${{ steps.filter.outputs.onoo }}
      website: ${{ steps.filter.outputs.website }}
      agent-gateway: ${{ steps.filter.outputs['agent-gateway'] }}
      zuiio-id: ${{ steps.filter.outputs['zuiio-id'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            zer:
              - 'apps/zer/**'
              - 'packages/core/**'
              - 'packages/hooks/**'
              - 'packages/query/**'
              - 'packages/ui/**'
              - 'packages/realtime/**'
              - 'packages/offline/**'
              - 'packages/hr/**'
              - 'packages/export/**'
              - 'packages/branding/**'
              - 'config/**'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            tolom:
              - 'apps/tolom/**'
              - 'packages/core/**'
              - 'packages/hooks/**'
              - 'packages/query/**'
              - 'packages/ui/**'
              - 'packages/realtime/**'
              - 'packages/offline/**'
              - 'packages/hr/**'
              - 'packages/export/**'
              - 'packages/branding/**'
              - 'config/**'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            onoo:
              - 'apps/onoo/**'
              - 'packages/core/**'
              - 'packages/branding/**'
              - 'config/**'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            website:
              - 'apps/website/**'
              - 'packages/core/**'
              - 'config/**'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            agent-gateway:
              - 'apps/agent-gateway/**'
              - 'packages/core/**'
              - 'packages/ai-agent/**'
              - 'packages/capture/**'
              - 'config/**'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            zuiio-id:
              - 'apps/zuiio-id/**'
              - 'packages/core/**'
              - 'packages/auth/**'
              - 'packages/branding/**'
              - 'config/**'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'

  deploy-zer:
    needs: detect-changes
    if: needs.detect-changes.outputs.zer == 'true'
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: zer
      turbo-filter: zer
      author-email: "yesprice.mn@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_ZER }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_ZER }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ZER }}

  deploy-tolom:
    needs: detect-changes
    if: needs.detect-changes.outputs.tolom == 'true'
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: tolom
      turbo-filter: tolom
      author-email: "themuln.official@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_TOLOM }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_TOLOM }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TOLOM }}

  deploy-onoo:
    needs: detect-changes
    if: needs.detect-changes.outputs.onoo == 'true'
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: onoo
      turbo-filter: onoo-web
      author-email: "zerone.offical@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_ONOO }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_ONOO }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ONOO }}

  deploy-website:
    needs: detect-changes
    if: needs.detect-changes.outputs.website == 'true'
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: website
      turbo-filter: "@zuiio/website"
      author-email: "zerone.offical@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_WEBSITE }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_WEBSITE }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}

  deploy-agent-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs['agent-gateway'] == 'true'
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: agent-gateway
      turbo-filter: agent-gateway
      author-email: "zerone.offical@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_AGENT }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_AGENT }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_AGENT }}

  deploy-zuiio-id:
    needs: detect-changes
    if: needs.detect-changes.outputs['zuiio-id'] == 'true'
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: zuiio-id
      turbo-filter: "@zuiio/id"
      author-email: "themuuln6@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_ZUIIO_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_ZUIIO_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ZUIIO_ID }}
