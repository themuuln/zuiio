name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      app:
        description: "App to deploy (empty = auto-detect from changes)"
        required: false
        type: choice
        options:
          - ""
          - website
          - agent-gateway
          - zuiio-id

permissions:
  contents: read

jobs:
  # ─── Detect which apps actually changed ───
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      agent-gateway: ${{ steps.filter.outputs['agent-gateway'] }}
      zuiio-id: ${{ steps.filter.outputs['zuiio-id'] }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            website:
              - 'apps/website/**'
            agent-gateway:
              - 'apps/agent-gateway/**'
            zuiio-id:
              - 'apps/zuiio-id/**'
            # Shared packages and root config affect ALL apps
            shared:
              - 'packages/**'
              - 'config/**'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'

  # ─── Typecheck deploying apps BEFORE burning a Vercel deploy ───
  typecheck:
    needs: detect-changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          sparse-checkout: |
            apps/website
            apps/agent-gateway
            apps/zuiio-id
            packages
            config
            pnpm-lock.yaml
            pnpm-workspace.yaml
            package.json
            turbo.json
            tsconfig.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 🧹 FastGate — lint
        run: pnpm turbo run lint --continue
      - name: 🧪 FastGate — test with coverage
        run: pnpm turbo run test:coverage --continue
        continue-on-error: false
      - name: Typecheck deploying apps
        env:
          SHARED: ${{ needs.detect-changes.outputs.shared }}
          WEBSITE: ${{ needs.detect-changes.outputs.website }}
          AGENT_GW: ${{ needs.detect-changes.outputs['agent-gateway'] }}
          ZUIIO_ID: ${{ needs.detect-changes.outputs['zuiio-id'] }}
        run: |
          # Only typecheck apps that will actually deploy (matching deploy-* job conditions)
          FAILED=""
          if [ "$WEBSITE" = "true" ] || [ "$SHARED" = "true" ]; then
            echo "🔍 Typechecking website..."
            pnpm --filter website exec tsc --noEmit 2>&1 || FAILED="$FAILED website"
          fi
          if [ "$AGENT_GW" = "true" ] || [ "$SHARED" = "true" ]; then
            echo "🔍 Typechecking agent-gateway..."
            pnpm --filter agent-gateway exec tsc --noEmit 2>&1 || FAILED="$FAILED agent-gateway"
          fi
          if [ "$ZUIIO_ID" = "true" ] || [ "$SHARED" = "true" ]; then
            echo "🔍 Typechecking zuiio-id..."
            pnpm --filter zuiio-id exec tsc --noEmit 2>&1 || FAILED="$FAILED zuiio-id"
          fi
          if [ -n "$FAILED" ]; then
            echo ""
            echo "❌ Typecheck failed for:$FAILED"
            exit 1
          fi
          echo "✅ All deploying apps passed typecheck"

  # ─── Deploy only changed apps ───
  # NOTE: zer and tolom moved to standalone repos (themuuln/zer, themuuln/tolom)
  # and deploy from their own CI. Remove apps/zer + apps/tolom from this repo.

  deploy-website:
    needs: [detect-changes, typecheck]
    if: |
      always() && !cancelled() &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      (inputs.app == 'website' || needs.detect-changes.outputs.website == 'true' || needs.detect-changes.outputs.shared == 'true')
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: website
      turbo-filter: website
      author-email: "zerone.offical@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_WEBSITE }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_WEBSITE }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}

  deploy-agent-gateway:
    needs: [detect-changes, typecheck]
    if: |
      always() && !cancelled() &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      (inputs.app == 'agent-gateway' || needs.detect-changes.outputs['agent-gateway'] == 'true' || needs.detect-changes.outputs.shared == 'true')
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: agent-gateway
      turbo-filter: agent-gateway
      author-email: "zerone.offical@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_AGENT }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_AGENT }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_AGENT }}

  deploy-zuiio-id:
    needs: [detect-changes, typecheck]
    if: |
      always() && !cancelled() &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      (inputs.app == 'zuiio-id' || needs.detect-changes.outputs['zuiio-id'] == 'true' || needs.detect-changes.outputs.shared == 'true')
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: zuiio-id
      turbo-filter: zuiio-id
      author-email: "themuuln6@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_ZUIIO_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_ZUIIO_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ZUIIO_ID }}
