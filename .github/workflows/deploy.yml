name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      app:
        description: "App to deploy (empty = auto-detect from changes)"
        required: false
        type: choice
        options:
          - ""
          - zer
          - tolom
          - onoo
          - website
          - agent-gateway
          - zuiio-id

permissions:
  contents: read

jobs:
  # ─── Detect which apps actually changed ───
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      zer: ${{ steps.filter.outputs.zer }}
      tolom: ${{ steps.filter.outputs.tolom }}
      onoo: ${{ steps.filter.outputs.onoo }}
      website: ${{ steps.filter.outputs.website }}
      agent-gateway: ${{ steps.filter.outputs['agent-gateway'] }}
      zuiio-id: ${{ steps.filter.outputs['zuiio-id'] }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            zer:
              - 'apps/zer/**'
            tolom:
              - 'apps/tolom/**'
            onoo:
              - 'apps/onoo/**'
            website:
              - 'apps/website/**'
            agent-gateway:
              - 'apps/agent-gateway/**'
            zuiio-id:
              - 'apps/zuiio-id/**'
            # Shared packages and root config affect ALL apps
            shared:
              - 'packages/**'
              - 'config/**'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'

  # ─── Typecheck changed apps BEFORE burning a Vercel deploy ───
  typecheck:
    needs: detect-changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: false
          sparse-checkout: |
            apps/zer
            apps/tolom
            apps/onoo
            apps/website
            apps/agent-gateway
            apps/zuiio-id
            packages
            config
            pnpm-lock.yaml
            pnpm-workspace.yaml
            package.json
            turbo.json
            tsconfig.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck changed apps
        env:
          SHARED: ${{ needs.detect-changes.outputs.shared }}
          ZER: ${{ needs.detect-changes.outputs.zer }}
          TOLOM: ${{ needs.detect-changes.outputs.tolom }}
          ONOO: ${{ needs.detect-changes.outputs.onoo }}
          WEBSITE: ${{ needs.detect-changes.outputs.website }}
          AGENT_GW: ${{ needs.detect-changes.outputs['agent-gateway'] }}
          ZUIIO_ID: ${{ needs.detect-changes.outputs['zuiio-id'] }}
        run: |
          FAILED=""
          TYPECHECK_ALL="$SHARED"
          if [ "$TYPECHECK_ALL" = "true" ] || [ "$ZER" = "true" ]; then
            echo "🔍 Typechecking zer..."
            pnpm --filter zer exec tsc --noEmit 2>&1 || FAILED="$FAILED zer"
          fi
          if [ "$TYPECHECK_ALL" = "true" ] || [ "$TOLOM" = "true" ]; then
            echo "🔍 Typechecking tolom..."
            pnpm --filter tolom exec tsc --noEmit 2>&1 || FAILED="$FAILED tolom"
          fi
          if [ "$TYPECHECK_ALL" = "true" ] || [ "$ONOO" = "true" ]; then
            echo "🔍 Typechecking onoo..."
            pnpm --filter onoo-web exec tsc --noEmit 2>&1 || FAILED="$FAILED onoo"
          fi
          if [ "$TYPECHECK_ALL" = "true" ] || [ "$WEBSITE" = "true" ]; then
            echo "🔍 Typechecking website..."
            pnpm --filter "@zuiio/website" exec tsc --noEmit 2>&1 || FAILED="$FAILED website"
          fi
          if [ "$TYPECHECK_ALL" = "true" ] || [ "$AGENT_GW" = "true" ]; then
            echo "🔍 Typechecking agent-gateway..."
            pnpm --filter agent-gateway exec tsc --noEmit 2>&1 || FAILED="$FAILED agent-gateway"
          fi
          if [ "$TYPECHECK_ALL" = "true" ] || [ "$ZUIIO_ID" = "true" ]; then
            echo "🔍 Typechecking zuiio-id..."
            pnpm --filter "@zuiio/id" exec tsc --noEmit 2>&1 || FAILED="$FAILED zuiio-id"
          fi
          if [ -n "$FAILED" ]; then
            echo ""
            echo "❌ Typecheck failed for:$FAILED"
            exit 1
          fi
          echo "✅ All changed apps passed typecheck"

  # ─── Deploy only changed apps ───

  deploy-zer:
    needs: [detect-changes, typecheck]
    if: |
      always() && !cancelled() &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      (inputs.app == 'zer' || needs.detect-changes.outputs.zer == 'true' || needs.detect-changes.outputs.shared == 'true')
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: zer
      turbo-filter: zer
      author-email: "yesprice.mn@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_ZER }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_ZER }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ZER }}

  deploy-tolom:
    needs: [detect-changes, typecheck]
    if: |
      always() && !cancelled() &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      (inputs.app == 'tolom' || needs.detect-changes.outputs.tolom == 'true' || needs.detect-changes.outputs.shared == 'true')
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: tolom
      turbo-filter: tolom
      author-email: "themuln.official@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_TOLOM }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_TOLOM }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TOLOM }}

  deploy-onoo:
    needs: [detect-changes, typecheck]
    if: |
      always() && !cancelled() &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      (inputs.app == 'onoo' || needs.detect-changes.outputs.onoo == 'true' || needs.detect-changes.outputs.shared == 'true')
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: onoo
      turbo-filter: onoo-web
      author-email: "zerone.offical@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_ONOO }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_ONOO }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ONOO }}

  deploy-website:
    needs: [detect-changes, typecheck]
    if: |
      always() && !cancelled() &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      (inputs.app == 'website' || needs.detect-changes.outputs.website == 'true' || needs.detect-changes.outputs.shared == 'true')
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: website
      turbo-filter: "@zuiio/website"
      author-email: "zerone.offical@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_WEBSITE }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_WEBSITE }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}

  deploy-agent-gateway:
    needs: [detect-changes, typecheck]
    if: |
      always() && !cancelled() &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      (inputs.app == 'agent-gateway' || needs.detect-changes.outputs['agent-gateway'] == 'true' || needs.detect-changes.outputs.shared == 'true')
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: agent-gateway
      turbo-filter: agent-gateway
      author-email: "zerone.offical@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_AGENT }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_AGENT }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_AGENT }}

  deploy-zuiio-id:
    needs: [detect-changes, typecheck]
    if: |
      always() && !cancelled() &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      (inputs.app == 'zuiio-id' || needs.detect-changes.outputs['zuiio-id'] == 'true' || needs.detect-changes.outputs.shared == 'true')
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: zuiio-id
      turbo-filter: "@zuiio/id"
      author-email: "themuuln6@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_ZUIIO_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_ZUIIO_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ZUIIO_ID }}
