name: Deploy Zer

on:
  push:
    branches: [main]
    paths:
      - "apps/zer/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-zer.yml"
      - ".github/workflows/_deploy-vercel.yml"

concurrency:
  group: deploy-zer
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: zer
      turbo-filter: zer
      author-email: "yesprice.mn@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_ZER }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_ZER }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ZER }}
