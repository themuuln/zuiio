name: Deploy Zer

on:
  push:
    branches: [main]
    paths:
      - 'apps/zer/**'
      - 'packages/**'
      - '.github/workflows/deploy-zer.yml'

concurrency:
  group: deploy-zer
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_ZER }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ZER }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_ZER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Vercel-compatible git author
        run: |
          git config user.email "yesprice.mn@gmail.com"
          git config user.name "Temuulen Undrakhbayar"
          git commit --amend --no-edit --reset-author

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Enable corepack
        run: corepack enable

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Stage Vercel project config
        run: |
          mkdir -p .vercel
          echo '{"projectId":"'$VERCEL_PROJECT_ID'","orgId":"'$VERCEL_ORG_ID'"}' > .vercel/project.json

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Check build output
        run: |
          echo "=== .vercel/output ==="
          ls -la .vercel/output/ 2>/dev/null || echo "No .vercel/output"
          du -sh .vercel/output/ 2>/dev/null || echo "No size"
          echo "=== builds.json ==="
          cat .vercel/output/builds.json 2>/dev/null || echo "No builds.json"

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
