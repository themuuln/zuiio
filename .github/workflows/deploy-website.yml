name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "apps/website"
      - "apps/website/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-website.yml"
      - ".github/workflows/_deploy-vercel.yml"

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: website
      turbo-filter: "@zuiio/website"
      author-email: "zerone.offical@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_WEBSITE }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_WEBSITE }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}
