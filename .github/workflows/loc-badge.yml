name: LOC Badge

# Regenerates apps/website/public/loc.json (shields.io endpoint badge) + loc-projects.json
# and commits them. The website deploy (deploy.yml) serves them at https://zuiiotech.com/loc.json
# so the badge URL never changes even as the number grows.
#
# Badge usage: https://img.shields.io/endpoint?url=https%3A%2F%2Fzuiiotech.com%2Floc.json
# Or in Markdown: ![Zuiio LOC](https://img.shields.io/endpoint?url=https%3A%2F%2Fzuiiotech.com%2Floc.json)
#
# Private submodules are only counted when the SUBMODULE_PAT secret exists
# (PAT with repo scope). Without it, the badge reflects the superproject tree.

on:
  push:
    branches: [main]
    # Ignore our own output so the badge commit does not re-trigger this workflow.
    paths-ignore:
      - "apps/website/public/loc.json"
      - "apps/website/public/loc-projects.json"
      - "**.md"
      - "docs/**"
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loc-badge
  cancel-in-progress: false

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Init private submodules (optional)
        if: env.HAVE_SUBMODULE_PAT == 'true'
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive
        env:
          HAVE_SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT != '' }}
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}

      - name: Install tokei
        run: |
          curl -sSL -o /tmp/tokei.tar.gz \
            "https://github.com/cargo-bins/cargo-quickinstall/releases/download/tokei-14.0.0/tokei-14.0.0-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf /tmp/tokei.tar.gz -C /usr/local/bin
          tokei --version

      - name: Generate badge
        run: bash scripts/loc-badge.sh

      - name: Commit badge if changed
        run: |
          if git diff --quiet -- apps/website/public/loc.json apps/website/public/loc-projects.json; then
            echo "Badge unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/website/public/loc.json apps/website/public/loc-projects.json
          git commit -m "chore(website): update LOC badge"
          git push
