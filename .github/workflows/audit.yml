name: FullGate — Audit
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: fullgate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── FastGate (T1) — already runs via verify.yml, skip if just came from there
  fastgate:
    uses: ./.github/workflows/verify.yml

  # ─── T3 Parallel: Security ───
  security:
    needs: fastgate
    if: always() && !cancelled()
    runs-on: [self-hosted, macOS, arm64, builder]
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
      - name: TruffleHog secret scan (verified)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified --fail-verified
        continue-on-error: true
      - name: pnpm audit
        run: pnpm audit --audit-level high
        continue-on-error: true
      - name: Semgrep scan
        continue-on-error: true
        run: |
          pip install semgrep
          semgrep scan --config=auto --error .

  # ─── T3 Parallel: License ───
  license:
    needs: fastgate
    if: always() && !cancelled()
    runs-on: [self-hosted, macOS, arm64, builder]
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - run: corepack enable
      - uses: actions/setup-node@v7.0.0
        with: { node-version: "24" }
      - run: pnpm install --frozen-lockfile
      - name: Check licenses
        run: pnpm licenses check
        continue-on-error: true

  # ─── Gate Aggregator ───
  # NOTE: zer integration/e2e/visual/perf gates moved with zer to the
  # standalone repo (themuuln/zer), which runs its own CI.
  gate-result:
    if: always() && !cancelled()
    needs: [fastgate, security, license]
    runs-on: [self-hosted, macOS, arm64, builder]
    steps:
      - name: Check gate results
        run: |
          echo "=== FullGate Results ==="
          echo "FastGate: ${{ needs.fastgate.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "License:  ${{ needs.license.result }}"
          if [ "${{ needs.fastgate.result }}" = "failure" ]; then
            echo "❌ FastGate failed — PR blocked"
            exit 1
          fi
          echo "✅ All gates passed — PR can merge"
