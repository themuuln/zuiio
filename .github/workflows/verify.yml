name: Verify — Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".gitignore"

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6.0.10
      - run: corepack enable

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard gate: any failure blocks the merge. This is the un-bypassable
      # backstop for the local pre-commit gate (hooks/pre/commit-gate.sh).
      - name: 🔍 Typecheck
        run: pnpm turbo run typecheck --continue

      - name: 🧹 Lint
        run: pnpm turbo run lint --continue

      - name: 🧪 Unit tests with coverage
        run: pnpm turbo run test:coverage --continue

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 7
          include-hidden-files: true
