name: Verify — Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".gitignore"

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: [self-hosted, macOS, arm64, builder]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      # The builder has Node and pnpm installed; installer actions unpack into a
      # shared ~/setup-pnpm that races when several runner jobs start together.
      - name: Use the builder toolchain
        run: |
          {
            echo /opt/homebrew/bin
            echo "$PWD/node_modules/.bin"
          } >> "$GITHUB_PATH"
          /opt/homebrew/bin/pnpm --version
      - run: corepack enable

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard gate: any failure blocks the merge. This is the un-bypassable
      # backstop for the local pre-commit gate (hooks/pre/commit-gate.sh).
      - name: 🔍 Typecheck
        run: pnpm turbo run typecheck --continue

      - name: 🧹 Lint
        run: pnpm turbo run lint --continue

      - name: 🧪 Unit tests with coverage
        run: pnpm turbo run test:coverage --continue

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 7
          include-hidden-files: true
