name: Deploy Agent Gateway

on:
  push:
    branches: [main]
    paths:
      - "apps/agent-gateway/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-agent-gateway.yml"
      - ".github/workflows/_deploy-vercel.yml"

concurrency:
  group: deploy-agent-gateway
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app: agent-gateway
      turbo-filter: agent-gateway
      author-email: "zerone.offical@gmail.com"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_AGENT }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_AGENT }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_AGENT }}
