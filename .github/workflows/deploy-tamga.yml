name: Deploy Tamga

on:
  push:
    branches: [main]
    paths:
      - 'apps/tamga/**'

concurrency:
  group: deploy-tamga
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_TAMGA }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TAMGA }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_TAMGA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Vercel-compatible git author
        run: |
          git config user.email "themuln.official@gmail.com"
          git config user.name "Temuulen Undrakhbayar"
          git commit --amend --no-edit --reset-author

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Enable corepack
        run: corepack enable


      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
