name: Onoo CI

on:
  push:
    branches: [main]
    paths:
      - "apps/onoo/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/onoo/**"

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: onoo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Colima and Docker
        run: |
          brew install colima docker
          colima start --cpu 4 --memory 8 --disk 60
          # Wait for Docker daemon to be ready
          for i in $(seq 1 30); do
            docker info > /dev/null 2>&1 && break
            sleep 2
          done
          docker info > /dev/null 2>&1 || { echo "::error::Docker daemon not ready after 60s"; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start --exclude studio,imgproxy,logflare,edge-runtime,vector,analytics

      - uses: pnpm/action-setup@v4
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all tests
        run: pnpm --filter onoo-web test:all
